<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image</title>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <div class="form-page">
        <div class="grid-container">
            <div style="grid-area: box-1; background-color: white;" class="side">
                <div>
        
                </div>
                <div style="border-left: 2px solid rgba(128, 128, 128, 0.31)">
                    <h2></h2>
                    <p></p>
                </div>
            </div>

            <div class="item" style="grid-area: box-2; text-align: center; background-color: white;">
                <h2 style="color: floralwhite nowrap;"></h2>
                <p>New video </p>
            </div>
            <div class="item" style="grid-area: box-3; text-align: center; background-color: white;">
                <h2 style="color: red;">5</h2>
                <p>Out of stock</p>
            </div>
            <div class="item" style="grid-area: box-4; background-color: white;">

                <form method="post" class="the-form" action="/form" id="form">
                    <h2 style="margin: 0;">Add Product</h2>
                    <input type="text" name="name" id="" placeholder="Upload video">
                    <input type="text" name="name" id="" placeholder="Video Name">
                    <input type="text" name="category" id="" placeholder="Quality">
                    <input type="number" name="price" id="" placeholder="Date">
                    <input type="number" name="quantity" id="" placeholder="Video thumbnail">
                    <div class="inner">
                        <input type="text" name="color" id="" placeholder="Color" style="width: 100%;">
                        <input type="file" name="" id="" placeholder="Upload Image" style="width: 100%;">
                    </div>
                    <div class="inner">
                        <button type="submit" style="color: rgb(39, 36, 36); background-color: rgb(177, 32, 32);">SAVE</button>
                        <button style="color: rgb(48, 44, 44); background-color: rgba(220, 14, 14, 0.796);">CLEAR</button>
                    </div>
                </form>
            </div>
            <div class="table1" style="grid-area: box-5; background-color: white;">
                <table>
                    <thead>
                        <tr>
                            
                            <th>VIDEO NAME</th>

                            <th>VIDEO QUALITY</th>

                            <th>DATE UPOADED</th>

                            <th>VIDEO THUMBNAIL</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            
                    
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>

</html>
